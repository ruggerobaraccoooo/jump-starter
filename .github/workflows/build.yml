# Builds Jump Starter installers on real Windows, Linux and macOS machines.
# Runs on every push to main and can be started by hand (Actions → Build → Run workflow).
# Download the installers from the run's "Artifacts" section.
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest   # .msi + .exe (NSIS) installers
            name: windows
          - os: ubuntu-22.04     # .deb, .rpm and .AppImage (Intel/AMD PCs)
            name: linux
          - os: ubuntu-22.04-arm # same for ARM, e.g. an Ubuntu VM in UTM on Apple silicon
            name: linux-arm
          - os: macos-latest     # .dmg (Apple silicon)
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Linux system libraries
        if: startsWith(matrix.name, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev build-essential file patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Build installers
        run: npx tauri build

      - uses: actions/upload-artifact@v7
        with:
          name: jump-starter-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: ignore
