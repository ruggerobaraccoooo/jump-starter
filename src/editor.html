<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    html, body { height: 100%; background: var(--paper); }
    body { display: grid; grid-template-columns: 250px 1fr; }
    aside { border-right: 1px solid var(--hairline); display: flex; flex-direction: column; min-height: 0; }
    .drag { height: 38px; -webkit-app-region: drag; flex: none; }
    aside .title { padding: 4px 18px 8px; font-size: 22px; }
    #list { flex: 1; overflow-y: auto; }
    .row { display: flex; align-items: center; gap: 10px; padding: 9px 18px; font-size: 15px; font-weight: 500; }
    .row .num { font-size: 11px; color: var(--muted); width: 16px; }
    .row .name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row.selected { background: var(--accent); }
    .row.selected .num { color: var(--ink); }
    .row.drop-target { box-shadow: inset 0 2px 0 var(--ink); }
    .bar { border-top: 1px solid var(--ink); padding: 12px; display: flex; gap: 8px; align-items: center; }

    main { overflow-y: auto; padding: 38px 32px 24px; }
    .crumb { font-size: 12px; }
    .name-input { width: 100%; border: 0; outline: 0; background: transparent; font-size: 34px; font-weight: 600;
                  padding: 2px 0; margin-top: 4px; -webkit-user-select: text; user-select: text; }
    .shortcuts { margin-top: 18px; display: grid; gap: 10px; }
    .sc { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .sc .hint { color: var(--muted); font-size: 12px; margin-right: auto; }
    .sc .rec { font-size: 13px; font-weight: 500; padding: 4px 14px; border-radius: 999px; border: 1px solid var(--ink); }
    .sc .rec.set { background: var(--ink); color: var(--paper); }
    .sc .rec.recording { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
    .sc .err { color: var(--danger); font-size: 12px; text-align: right; }
    .icon-btn { width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; }
    .icon-btn svg { width: 13px; height: 13px; }
    .apps-head { display: flex; align-items: center; gap: 14px; padding: 12px 0; font-size: 12px; font-weight: 500; }
    .apps-head span { margin-right: auto; }
    .app { padding: 10px 0; border-bottom: 1px solid var(--hairline); }
    .app:last-child { border-bottom: 0; }
    .app-line { display: flex; align-items: center; gap: 10px; font-size: 14px; }
    .app-line img, .app-line .tile { width: 34px; height: 34px; border-radius: 8px; }
    .app-line .tile { display: flex; align-items: center; justify-content: center; background: var(--hairline); font-weight: 600; }
    .app-line .label { margin-right: auto; display: flex; align-items: center; gap: 6px; }
    .profiles { padding: 4px 0 4px 44px; }
    .profile { padding: 8px 0; }
    .profile + .profile { border-top: 1px solid var(--hairline); }
    .profile-head { display: flex; align-items: center; gap: 8px; font-size: 12px; margin-bottom: 8px; }
    .profile-head span { margin-right: auto; }
    .field { display: flex; align-items: center; gap: 6px; flex: 1; padding: 6px 10px; border-radius: 6px;
             border: 1px solid var(--hairline); background: var(--field); font-size: 12px; }
    .field input { border: 0; outline: 0; background: transparent; flex: 1; -webkit-user-select: text; user-select: text; }
    .profile-input { max-width: 200px; border-radius: 999px; padding: 4px 12px; }
    .url { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
    .plus-label { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; padding: 4px 0; }
    .plus-label .ring { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--ink);
                        display: inline-flex; align-items: center; justify-content: center; }
    .plus-label svg { width: 10px; height: 10px; }
    .bottom { display: flex; align-items: center; gap: 8px; padding-top: 14px; margin-top: 14px; border-top: 1px solid var(--ink); }
    .bottom .circle { width: 40px; height: 40px; }
    .bottom .count { margin-left: auto; font-size: 13px; }
    .placeholder { padding: 32px; }
    .placeholder h2 { font-weight: 600; font-size: 26px; margin: 0 0 8px; }
  </style>
</head>
<body>
  <aside>
    <div class="drag"></div>
    <div class="title display">Groups<sup>*</sup></div>
    <div id="list"></div>
    <div class="bar" id="bar"></div>
  </aside>
  <main id="detail"></main>
  <script type="module" src="editor.js"></script>
</body>
</html>
