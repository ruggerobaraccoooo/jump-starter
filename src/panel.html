<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    html, body { background: transparent; height: 100%; overflow: hidden; }
    body { display: flex; flex-direction: column; align-items: center; padding: 2px 20px 28px; }
    body.anchor-bottom { justify-content: flex-end; padding: 28px 20px 2px; }

    .panel { width: 380px; max-height: 100%; display: flex; flex-direction: column; background: var(--paper);
             border-radius: 12px; overflow: hidden; border: .5px solid color-mix(in srgb, var(--hairline) 80%, transparent);
             box-shadow: 0 6px 28px rgba(0, 0, 0, .18); }
    header { display: flex; align-items: center; justify-content: space-between; padding: 18px 18px 10px; }
    header .display { font-size: 22px; }
    .groups { padding: 0 18px 12px; overflow-y: auto; scrollbar-width: thin; }
    footer { display: flex; justify-content: space-between; align-items: center; padding: 12px 18px;
             background: var(--footer); font-size: 13px; }
    footer button { display: inline-flex; gap: 6px; align-items: center; }
    footer svg { width: 13px; height: 13px; }

    /* One group = one element that morphs between collapsed and expanded. */
    .group { padding: 12px 0; margin: 0; border-radius: 0; background-color: transparent;
             transition: padding var(--dur) var(--ease), margin var(--dur) var(--ease),
                         border-radius var(--dur) var(--ease), background-color var(--dur) var(--ease); }
    .group.expanded { padding: 14px; margin: 6px 0; border-radius: 12px; background-color: var(--accent); }
    .g-head { display: flex; align-items: center; gap: 8px; }
    .g-name { flex: 1; font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
              transition: font-size var(--dur) var(--ease); }
    .expanded .g-name { font-size: 24px; }
    .chev { width: 14px; height: 14px; transition: transform var(--dur) var(--ease); }
    .expanded .chev { transform: rotate(180deg); }
    .reveal { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--dur) var(--ease); }
    .expanded .reveal { grid-template-rows: 1fr; }
    .reveal > div { overflow: hidden; min-height: 0; }
    .status { font-size: 12px; padding-top: 10px; }
    .progress { height: 9px; border-radius: 5px; background: var(--accent-deep); margin-top: 6px; overflow: hidden; }
    .progress > div { height: 100%; background: var(--ink); border-radius: 5px; transition: width var(--dur) var(--ease); }
    .g-apps { display: flex; align-items: center; gap: 6px; padding-top: 8px; transition: padding var(--dur) var(--ease); }
    .expanded .g-apps { padding-top: 14px; }
    .icons { flex: 1; display: flex; flex-wrap: wrap; gap: 6px 4px; }
    .actions { display: flex; align-items: center; gap: 6px; padding-top: 12px; }
    .actions .slash { margin-right: auto; }
    .divider { height: 1px; background: var(--hairline); transition: opacity var(--dur) var(--ease); }
    .divider.gone { opacity: 0; }
    .empty { padding: 8px 0 14px; }
    .empty h2 { font-weight: 500; font-size: 18px; margin: 0 0 6px; }
    .empty p { font-size: 13px; margin: 0 0 10px; }
  </style>
</head>
<body>
  <div class="panel" id="panel">
    <header>
      <span class="display">Jump Starter<sup>*</sup></span>
      <button class="circle" id="add" title="New group"></button>
    </header>
    <div class="groups" id="groups"></div>
    <footer>
      <button id="edit"></button>
      <button class="slash" id="quit">/ quit</button>
    </footer>
  </div>
  <script type="module" src="panel.js"></script>
</body>
</html>
